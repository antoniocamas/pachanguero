# Default values for pachanguero. Secrets go in values.secrets.yaml (git-ignored).

# Name the cluster pulls images from: k3s maps it to the NodePort registry on erebor
# (/etc/rancher/k3s/registries.yaml). build.sh pushes to 192.168.1.87:30500, the same registry.
registry: 'registry.local:5000'

image:
  name: pachanguero
  tag: '' # empty = the chart's appVersion

# The address the browser reaches the app at. The bank sends the browser back to
# <publicUrl>/api/bank/callback, which must be registered exactly at the bank's developer side.
publicUrl: 'https://pachanguero.duckdns.org'

service:
  nodePort: 9400 # where Caddy on numenor connects: 192.168.1.87:9400

storage:
  className: data-disk
  dataSize: 1Gi

backup:
  enabled: true
  # One periodic backup a week. Names carry UTC time; the schedule is Madrid time, like the
  # backup shipper's, and papiros is up from 08:00.
  weekday: Tue # one of Mon Tue Wed Thu Fri Sat Sun (`date +%a`); a day without a game
  timeMadrid: '08:15' # HH:MM, Europe/Madrid
  # Where backups are written on erebor, mounted at /backups. The backup shipper reads and trims it.
  # The folder must exist, owned by uid 1000.
  stagingPath: /var/backups/erebor/pachanguero

resources:
  requests:
    memory: '64Mi'
    cpu: '50m'
  limits:
    memory: '256Mi'
    cpu: '500m'

secrets:
  jwtSecret: '' # required, 32+ characters; set it in values.secrets.yaml
  # Optional: without them the app starts and the Banco panel names what is missing.
  enableBankingAppId: '' # the application id; set it in values.secrets.yaml
  enableBankingPrivateKey: '' # the PEM private key (a YAML block); set it in values.secrets.yaml
