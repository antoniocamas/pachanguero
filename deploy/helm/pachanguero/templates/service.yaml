apiVersion: v1
kind: Service
metadata:
  name: pachanguero
  namespace: {{ .Release.Namespace }}
  labels:
    app: pachanguero
spec:
  type: NodePort
  selector:
    app: pachanguero
  ports:
  - name: http
    port: 8787
    targetPort: http
    nodePort: {{ .Values.service.nodePort }}
    protocol: TCP
