apiVersion: v1
kind: Secret
metadata:
  name: pachanguero
  namespace: {{ .Release.Namespace }}
  labels:
    app: pachanguero
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required (set it in values.secrets.yaml)" .Values.secrets.jwtSecret | quote }}
{{- with .Values.secrets.enableBankingAppId }}
  ENABLE_BANKING_APP_ID: {{ . | quote }}
{{- end }}
{{- with .Values.secrets.enableBankingPrivateKey }}
data:
  ENABLE_BANKING_PRIVATE_KEY: {{ . | b64enc | quote }}
{{- end }}
