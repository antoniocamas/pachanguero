{{- $version := default .Chart.AppVersion .Values.image.tag }}
{{- $image := printf "%s/%s:%s" .Values.registry .Values.image.name $version }}
{{- /* The backup sidecar compares `date +%a` (LC_ALL=C), so the weekday must be one of these. */}}
{{- if not (has .Values.backup.weekday (list "Mon" "Tue" "Wed" "Thu" "Fri" "Sat" "Sun")) }}
{{- fail "backup.weekday must be one of Mon Tue Wed Thu Fri Sat Sun" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pachanguero
  namespace: {{ .Release.Namespace }}
  labels:
    app: pachanguero
spec:
  # One writer: SQLite. Recreate stops the old pod before the new one opens the file.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pachanguero
  template:
    metadata:
      labels:
        app: pachanguero
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsUser: 1000   # the image's `node` user
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: pachanguero
        image: {{ $image }}
        imagePullPolicy: Always
        ports:
        - containerPort: 8787
          name: http
        env:
        - name: PACHANGUERO_PUBLIC_URL
          value: {{ .Values.publicUrl | quote }}
        - name: PACHANGUERO_VERSION
          value: {{ $version | quote }}
        envFrom:
        - secretRef:
            name: pachanguero
        volumeMounts:
        - name: data
          mountPath: /data
        - name: backups
          mountPath: /backups
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
      {{- if .Values.backup.enabled }}
      # Same pod = same node, so it can use the live database through the same volume.
      # One backup a week, at {{ .Values.backup.weekday }} {{ .Values.backup.timeMadrid }} Madrid time. The app never deletes
      # backups: the folder is the staging area of the backup shipper, which trims it.
      - name: backup
        image: {{ $image }}
        imagePullPolicy: Always
        env:
        - name: PACHANGUERO_VERSION
          value: {{ $version | quote }}
        command:
        - /bin/sh
        - -c
        - |
          last=""
          while true; do
            key=$(LC_ALL=C TZ=Europe/Madrid date '+%a %H:%M')
            if [ "$key" = "{{ .Values.backup.weekday }} {{ .Values.backup.timeMadrid }}" ] && [ "$key" != "$last" ]; then
              last="$key"
              pachanguero-admin backup || echo "backup failed"
            fi
            sleep 30
          done
        volumeMounts:
        - name: data
          mountPath: /data
        - name: backups
          mountPath: /backups
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
      {{- end }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pachanguero-data
      # The staging folder of the backup shipper on erebor. It must exist (type Directory):
      # without it the pod stays in ContainerCreating and nothing creates it.
      - name: backups
        hostPath:
          path: {{ .Values.backup.stagingPath }}
          type: Directory
