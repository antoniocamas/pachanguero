{{- $image := printf "%s/%s:%s" .Values.registry .Values.image.name (default .Chart.AppVersion .Values.image.tag) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pachanguero
  namespace: {{ .Release.Namespace }}
  labels:
    app: pachanguero
spec:
  # One writer: SQLite. Recreate stops the old pod before the new one opens the file.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pachanguero
  template:
    metadata:
      labels:
        app: pachanguero
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsUser: 1000   # the image's `node` user
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: pachanguero
        image: {{ $image }}
        imagePullPolicy: Always
        ports:
        - containerPort: 8787
          name: http
        env:
        - name: PACHANGUERO_PUBLIC_URL
          value: {{ .Values.publicUrl | quote }}
        envFrom:
        - secretRef:
            name: pachanguero
        volumeMounts:
        - name: data
          mountPath: /data
        - name: backups
          mountPath: /backups
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
      {{- if .Values.backup.enabled }}
      # Same pod = same node, so it can use the live database through the same volume.
      - name: backup
        image: {{ $image }}
        imagePullPolicy: Always
        command:
        - /bin/sh
        - -c
        - |
          while true; do
            now=$(date +%s)
            next=$(date -u -d "today {{ printf "%02d" (int .Values.backup.hourUtc) }}:00" +%s)
            [ "$next" -le "$now" ] && next=$(date -u -d "tomorrow {{ printf "%02d" (int .Values.backup.hourUtc) }}:00" +%s)
            sleep $((next - now))
            pachanguero-admin backup || echo "backup failed"
            ls -1t /backups/pachanguero-[0-9]*.db | grep -v before-migration | tail -n +$(({{ .Values.backup.keep }} + 1)) | xargs -r rm -f
          done
        volumeMounts:
        - name: data
          mountPath: /data
        - name: backups
          mountPath: /backups
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
      {{- end }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pachanguero-data
      - name: backups
        persistentVolumeClaim:
          claimName: pachanguero-backups
