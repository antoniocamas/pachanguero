<div class="page">
<h1>Deudas del jugador</h1>
<p class="lead">Pestaña «Deudas» (UC-004-05). Solo tus cantidades. De otros jugadores solo aparece el nombre de quien paga una parte tuya; tus invitados salen como «invitado», sin nombre.</p>
<nav class="index"><a href="index.html">Índice</a><a href="login.html">Entrar</a><a href="debts.html">Deudas</a><a href="payments.html">Pagos</a><a href="stats.html">Estadísticas</a><a href="settings.html">Ajustes del jugador</a><a href="admin-account.html">Ajustes del administrador</a></nav>
<div class="frames">
<figure class="shot"><figcaption><b>Con deudas.</b> Las partes que paga otro anfitrión van aparte y no suman.</figcaption><div class="phone"><div class="app">
<header class="top"><h1><span aria-hidden="true">⚽</span> Pachanguero<span class="who">Carlos García</span><button class="link">Salir</button></h1></header>

<div class="card"><h2>Debes<span class="right">10 €</span></h2>
<div class="row"><span class="name">mié, 7 oct<small>Partido del miércoles</small></span><span class="tag ">tu parte</span><span class="amount">5 €</span></div><div class="row"><span class="name">mié, 30 sep<small>Partido del miércoles</small></span><span class="tag ">invitado</span><span class="amount">5 €</span></div>
<div class="row total"><span class="name">Total que debes</span><span class="amount">10 €</span></div>
<p class="note">Incluye lo que debes por tus invitados.</p></div>
<div class="card"><h2>Pagan otros por ti</h2>
<div class="row"><span class="name">mié, 23 sep<small>Partido del miércoles</small></span><span class="tag ">lo paga Ana López</span><span class="amount">5 €</span></div>
<p class="note">Estos importes no suman en tu total: se los debes a quien los paga, no a la organización.</p></div>
</div><nav class="tabs"><button aria-current="true"><span class="ico" aria-hidden="true">💸</span>Deudas</button><button aria-current="false"><span class="ico" aria-hidden="true">🧾</span>Pagos</button><button aria-current="false"><span class="ico" aria-hidden="true">📊</span>Estadísticas</button><button aria-current="false"><span class="ico" aria-hidden="true">⚙️</span>Ajustes</button></nav></div></figure>
